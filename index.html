<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ลอยกระทงกับเธอ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sriracha&family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: อบอุ่น หวาน ขี้เล่น เกมสำหรับสองคน
IDEA: งานลอยกระทงริมแม่น้ำแบบ HD-2D ตัวละครพิกเซลในโลก 3D แสงเทียนเรือง
PICTURE: ฉาก three.js เต็มจอ ซุ้มไม้หลังคาไทย ท่าน้ำ แม่น้ำสะท้อนจันทร์ โคมลอย พลุ
COLOUR/TYPE: กลางคืนน้ำเงินเข้ม ทองแสงเทียน ชมพูบัว / Sriracha + Mali
LAYOUT: HUD กระจกมืดมุมจอแบบเกม แผงกิจกรรมเลื่อนขึ้นจากล่าง */
:root{color-scheme:dark;--ink:#fff6e6;--mute:#d9c9b0;--gold:#ffd27a;--mari:#f4a62a;--pink:#ff8fb5;--glass:rgba(12,18,34,.62);--sheet:rgba(10,20,38,.93);--line:rgba(255,226,180,.22);--chip:rgba(255,240,215,.08)}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:#060d1c;color:var(--ink);font:16px/1.55 'Mali',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0}#app canvas{display:block;width:100%;height:100%}
h1,h2,h3{font-family:'Sriracha',cursive;font-weight:400;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(40px,9vw,58px);color:var(--gold);text-shadow:0 0 24px rgba(255,190,90,.5)}
h2{font-size:clamp(26px,5vw,32px);color:var(--gold)}h3{font-size:21px}
p{margin:.4em 0}.mute{color:var(--mute);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{min-height:46px;padding:10px 22px;border:0;border-radius:999px;background:linear-gradient(180deg,#ffdf98,#f4a62a);color:#2b1500;font-weight:700;box-shadow:0 6px 18px rgba(244,166,42,.3)}
.btn.pink{background:linear-gradient(180deg,#ffc2d6,#ff7aa6);color:#3a0a1d}
.btn.ghost{background:var(--chip);color:var(--ink);box-shadow:none;border:1px solid var(--line);font-weight:600}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible,.rb:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input,textarea{font:inherit;font-size:16px;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);user-select:text;-webkit-user-select:text}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
/* intro */
#intro{position:fixed;inset:0;display:flex;overflow-y:auto;touch-action:pan-y;padding:16px;z-index:30;background:radial-gradient(ellipse at 50% 40%,rgba(6,13,28,.35),rgba(6,13,28,.85))}
#intro .box{margin:auto;width:min(440px,100%);text-align:center;padding:22px 22px;border-radius:28px;background:rgba(10,20,38,.8);border:1px solid var(--line);backdrop-filter:blur(8px)}
#intro .two{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end;text-align:left;margin:18px 0 20px}
#intro .heart{font-family:'Sriracha';color:var(--pink);font-size:28px;padding-bottom:6px}
#load{font-size:14px;color:var(--mute);margin-top:12px;min-height:1.4em}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 16px}
.pc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 8px;border-radius:18px;border:1px solid var(--line);background:var(--chip);font-weight:600;font-size:15px}
.pc canvas{width:68px;height:84px;image-rendering:pixelated}
.pc.on{border-color:var(--gold);background:rgba(255,210,122,.16);box-shadow:inset 0 0 0 1px var(--gold)}
.joinrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}
.joinrow input{text-align:center;font-size:20px;letter-spacing:.3em;font-weight:700}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin:12px 0 2px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.linkb{background:none;border:0;color:var(--gold);text-decoration:underline;font-size:15px;min-height:44px;margin-top:6px}
.code{font-family:'Sriracha';font-size:64px;letter-spacing:.12em;color:var(--gold);line-height:1;margin:6px 0 4px;text-shadow:0 0 24px rgba(255,190,90,.5)}
#room{font-size:13px;padding:4px 10px;border-radius:10px;width:max-content;display:none}#room.on{display:block}#room i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#888;margin-right:6px}#room.ok i{background:#7fe0a0}
#sb{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translate(-50%,140%);width:min(620px,calc(100% - 16px));max-height:46vh;overflow:auto;z-index:9;padding:12px 16px 14px;border-radius:22px;transition:transform .4s cubic-bezier(.2,.9,.25,1);touch-action:pan-y}
#sb.on{transform:translate(-50%,0)}.sbh{display:flex;align-items:center;gap:10px;margin-bottom:6px}#sbT{flex:1;font-family:'Sriracha';font-size:21px;color:var(--gold);line-height:1.2}#sbT .mute{font-family:'Mali';font-size:14px}
#sb .x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.3);flex:none;font-size:18px}#sb p{margin:.2em 0 .5em}#sb .hold{min-height:60px}#sb .result{margin-top:4px}
.steps{display:flex;gap:4px;margin:0 0 8px}.steps i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.15)}.steps i.on{background:var(--gold)}
.ring{--p:0;width:60px;height:60px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.12) 0);display:grid;place-items:center;flex:none}.ring::after{content:"";width:44px;height:44px;border-radius:50%;background:#0c1830}
.btn:disabled{opacity:.45;cursor:not-allowed}
#bSnd.off svg .w{display:none}#bSnd.off{opacity:.6}
#inv{position:fixed;left:50%;top:max(140px,18vh);transform:translateX(-50%);z-index:16;width:min(460px,calc(100% - 28px));padding:14px 16px;border-radius:18px;text-align:center;display:none}
#inv.on{display:block}#inv .row{justify-content:center;margin-top:10px}
.floatH{position:fixed;z-index:4;pointer-events:none;font-size:26px;color:#ff8fb5;text-shadow:0 0 10px #ff8fb5;animation:fh 1.6s ease-out forwards}
@keyframes fh{from{transform:translate(-50%,0) scale(.6);opacity:1}to{transform:translate(-50%,-90px) scale(1.2);opacity:0}}
.wait{display:flex;align-items:center;gap:10px;justify-content:center;padding:14px;border-radius:16px;background:var(--chip);border:1px dashed var(--line);margin-top:12px;color:var(--mute)}
/* HUD */
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#hudL{position:fixed;left:max(12px,env(safe-area-inset-left));top:12px;z-index:5;display:flex;gap:12px;align-items:flex-start;pointer-events:none}
#mini{width:136px;height:136px;pointer-events:auto;cursor:pointer;border-radius:50%;border:2px solid rgba(255,226,180,.35);box-shadow:0 6px 24px #0008;background:#0b1830}
#who{display:flex;flex-direction:column;gap:6px;padding-top:4px}
#names{font-family:'Sriracha';font-size:22px;line-height:1.1;text-shadow:0 2px 8px #000c;white-space:nowrap}
#names b{color:var(--pink);font-weight:400}
#quest{font-size:14px;padding:6px 12px;border-radius:12px;max-width:min(260px,52vw);line-height:1.35}
#quest b{color:var(--gold);font-weight:600}
#hudR{position:fixed;right:max(12px,env(safe-area-inset-right));top:12px;z-index:5;display:flex;gap:10px}
.rb{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;line-height:1;color:var(--ink);padding:0}
.rb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#zoom{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px}
#zoom button{width:40px;height:40px;border-radius:50%;border:0;background:none;font-size:22px}
#hint{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;display:flex;gap:8px;align-items:center;font-size:15px;text-shadow:0 2px 6px #000;white-space:nowrap;pointer-events:none}
.key{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:9px;background:#f6ecd8;color:#3a2a1a;font-weight:700;box-shadow:0 3px 0 #b9a27f}
#hint{display:none!important}
#act{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:6;display:none;align-items:center;gap:10px;padding:8px 8px 8px 18px;border-radius:999px;max-width:calc(100% - 32px)}
#act.on{display:flex}
#act span{font-family:'Sriracha';font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#act button{width:56px;height:56px;border-radius:50%;flex:none;font-size:20px}
#joy{position:fixed;left:24px;bottom:84px;width:120px;height:120px;border-radius:50%;z-index:5;display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,236,200,.35);border:1px solid rgba(255,236,200,.6)}
@media(pointer:coarse){#joy{display:block}#hint .k{display:none}}
.tag{position:fixed;left:0;top:0;z-index:3;pointer-events:none;transform:translate(-50%,-100%);padding:3px 10px;border-radius:8px;background:rgba(10,14,26,.72);border:1px solid rgba(255,226,180,.18);font-size:13px;font-weight:600;white-space:nowrap;transition:opacity .2s}
.tag.z{font-family:'Sriracha';font-size:16px;font-weight:400;color:var(--gold);background:rgba(10,14,26,.6)}
/* sheet */
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(680px,100%);max-height:84vh;overflow:auto;background:var(--sheet);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:22px clamp(16px,4vw,30px) calc(24px + env(safe-area-inset-bottom));z-index:10;transition:transform .45s cubic-bezier(.2,.9,.25,1);backdrop-filter:blur(10px);touch-action:pan-y}
#sheet.on{transform:translate(-50%,0)}#sheet.short{max-height:52vh}
#sheet .x{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.35);font-size:20px;line-height:1;z-index:2}
.ql{display:grid;gap:8px;margin-top:14px}
.qi{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:16px;border:1px solid var(--line);background:var(--chip)}
.qi .ck{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid var(--line);display:grid;place-items:center;font-size:14px}
.qi.done .ck{background:var(--gold);border-color:var(--gold);color:#2b1500}
.qi div{flex:1}.qi b{font-family:'Sriracha';font-weight:400;font-size:19px;color:var(--gold);display:block;line-height:1.2}.qi span{font-size:14px;color:var(--mute)}
.qi .btn{min-height:40px;padding:6px 16px;font-size:14px;flex:none}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--chip);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px}
.tabs button.on{background:var(--gold);color:#2b1500;border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--chip);display:inline-flex;align-items:center;gap:8px;font-size:15px}
.chip i{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.4)}
.chip.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:rgba(255,210,122,.16)}
.big{font-family:'Sriracha';font-size:clamp(40px,9vw,60px);color:var(--gold);line-height:1}
.mt{margin-top:16px}
.cstage{position:relative;height:170px;border-radius:18px;background:radial-gradient(ellipse at 50% 85%,#123d60,#06182a 70%);overflow:hidden;margin:12px 0}
.wick{position:absolute;left:50%;bottom:26px;width:26px;height:66px;margin-left:-13px;border-radius:6px 6px 3px 3px;background:linear-gradient(90deg,#ffc4d8,#ff92b5)}
.flame{position:absolute;left:50%;bottom:90px;width:30px;height:56px;margin-left:-15px;border-radius:50% 50% 45% 45%/62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 72%,#fff7d0 0 25%,#ffc14d 55%,rgba(255,110,40,0) 72%);transform-origin:50% 100%;filter:drop-shadow(0 0 18px rgba(255,180,80,.8))}
.windfx{position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 40px,rgba(200,230,255,.12) 40px 44px);opacity:0;transition:opacity .25s}
.windfx.on{opacity:1;animation:wind .5s linear infinite}@keyframes wind{to{background-position:-88px 0}}
.bar{height:14px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.bar>div{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--mari),var(--gold))}
.hold{flex:1;min-height:72px;border-radius:20px;font-size:18px;font-weight:700;border:0;touch-action:none}
.hold.l{background:linear-gradient(180deg,#ffdf98,#f4a62a);color:#2b1500}.hold.s{background:linear-gradient(180deg,#bfe3ff,#6fb2e8);color:#06223a}
.hold.down{filter:brightness(1.15);transform:scale(.97)}
.status{font-family:'Sriracha';font-size:22px;min-height:1.3em}.status.warn{color:#9fd3ff}.status.gust{color:#ff9fb8}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.opts button{min-height:58px;border-radius:16px;border:1px solid var(--line);background:var(--chip);font-weight:600;padding:8px 10px}
.opts button.ok{background:rgba(120,220,150,.22);border-color:#8fe0a6}.opts button.no{background:rgba(255,120,150,.18);border-color:#ff8fb5}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.card{aspect-ratio:3/4;border-radius:14px;border:1px solid var(--line);perspective:600px;background:none;padding:0}
.card .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.open .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:13px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;text-align:center;padding:4px}
.card .b{background:radial-gradient(circle at 50% 40%,#ffd27a33,transparent 60%),repeating-linear-gradient(45deg,#16385a 0 8px,#12304e 8px 16px)}
.card .b::after{content:"";width:40%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff1c9,#f2c14e);box-shadow:0 0 14px #ffd27a88}
.card .f{transform:rotateY(180deg);font-family:'Sriracha';font-size:clamp(15px,3.6vw,20px);color:#2b1500;line-height:1.1}
.card.done{opacity:.55}
.score{display:flex;gap:10px;margin-top:8px}.score div{flex:1;padding:8px 12px;border-radius:14px;background:var(--chip);border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score div.on{border-color:var(--gold);background:rgba(255,210,122,.14)}
.wwrap{position:relative;width:min(300px,100%);margin:10px auto 0;aspect-ratio:1}.wwrap canvas{width:100%;height:100%;display:block}
.wwrap::before{content:"";position:absolute;left:50%;top:-6px;margin-left:-13px;border:13px solid transparent;border-top:22px solid var(--pink);z-index:2}
.result{margin-top:14px;padding:14px 16px;border-radius:18px;background:linear-gradient(160deg,rgba(255,143,181,.18),rgba(255,210,122,.12));border:1px solid var(--line);text-align:center}
.result .t{font-family:'Sriracha';font-size:24px;color:var(--gold);line-height:1.2}
.cup{width:110px;height:150px;margin:14px auto 6px;position:relative;transform-origin:50% 100%}
.cup .body{position:absolute;bottom:0;left:0;right:0;height:96px;border-radius:10px 10px 30px 30px;background:linear-gradient(90deg,#8b2a1e,#c8452f 45%,#8b2a1e);box-shadow:inset 0 6px 0 #f2c14e}
.cup .st{position:absolute;bottom:60px;width:6px;border-radius:3px;background:linear-gradient(#f4d38a,#c79a4a)}
.cup.shake{animation:shake .18s ease-in-out 7}@keyframes shake{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
#mb{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:7;display:none;gap:10px;align-items:center;padding:8px 8px 8px 18px;border-radius:999px;max-width:calc(100% - 20px)}
#mb.on{display:flex}#mb .info{font-family:'Sriracha';font-size:19px;white-space:nowrap}
#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;z-index:12;width:min(400px,calc(100% - 32px));text-align:center;padding:26px 22px;border-radius:26px;background:linear-gradient(170deg,#fff1d6,#ffd9a0);color:#3a1d05;box-shadow:0 0 60px rgba(255,180,80,.5);transition:.3s}
#msg.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#msg .q{font-family:'Sriracha';font-size:25px;line-height:1.25;margin:6px 0 16px}
#toast{position:fixed;left:50%;top:max(140px,18vh);transform:translate(-50%,-10px);opacity:0;z-index:15;width:min(520px,calc(100% - 28px));padding:14px 18px;border-radius:18px;text-align:center;transition:.35s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .nq{font-size:12px;color:var(--gold);letter-spacing:.02em}
@media(max-width:600px){#mini{width:104px;height:104px}#names{font-size:18px}#quest{font-size:13px}.rb{width:44px;height:44px}#hint{display:none}}
@media(prefers-reduced-motion:reduce){#sheet{transition:none}.cup.shake{animation:none}}
</style>

<body>
<div id="app"></div>
<div id="tags"></div>

<div id="hudL">
  <canvas id="mini" width="272" height="272"></canvas>
  <div id="who"><div id="names"></div><div id="room" class="glass"></div><div id="quest" class="glass"></div></div>
</div>
<div id="hudR">
  <button class="rb glass" id="bSnd" type="button" aria-label="เปิดปิดเสียง"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
  <button class="rb glass" id="bHeart" type="button" aria-label="ส่งหัวใจ"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
  <button class="rb glass" id="bFire" type="button" aria-label="จุดพลุ"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></svg></button>
  <button class="rb glass" id="bMenu" type="button" aria-label="ภารกิจและกิจกรรม"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
</div>
<div id="zoom" class="glass"><button id="zOut" type="button" aria-label="ซูมออก">−</button><button id="zIn" type="button" aria-label="ซูมเข้า">+</button></div>
<div id="hint"><span class="k"><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span></span> เดิน หรือแตะพื้น · <span class="key">E</span> เข้าซุ้ม</div>
<div id="joy"><i></i></div>

let qz=null;
function qzNewMP(p){qz={mp:1,id:p.id,list:(p.list||[]).map(i=>QUIZ[i|0]).filter(Boolean).slice(0,6),i:0,a:[[],[]],g:[[],[]]}}
function qStep(){const i=qz.i,o=ot();if(i>=6)return'end';if(qz.a[me][i]==null)return'ans';if(qz.a[o][i]==null)return'waitA';if(qz.g[me][i]==null)return'guess';if(qz.g[o][i]==null)return'waitG';return'rev'}
function qScore(p){let s=0;for(let k=0;k<6;k++)if(qz.g[p][k]!=null&&qz.g[p][k]===qz.a[1-p][k])s++;return s}
function quizViewMP(){const o=ot(),st=qStep();let h=`<h2>ควิซรู้ใจ</h2>`;
 if(st==='end'){const a=qScore(me),b=qScore(o),t=a+b;h+=`<div class="result"><div class="big">${t}/12</div><div class="t">${t>=10?'รู้ใจกันที่สุดในโลก':t>=6?'รู้ใจกันดีเลย':'ยังมีเรื่องให้ค้นหากันอีกเยอะ น่ารักออก'}</div><p>${N(me)} ทายถูก ${a} ข้อ · ${N(o)} ทายถูก ${b} ข้อ</p></div><div class="row mt"><button class="btn" data-a="again" data-v="quiz">เล่นชุดใหม่</button>${back}</div>`;markDone('quiz');open(h,'quiz');return}
 const[q,opt]=qz.list[qz.i];h+=`<p class="mute">ข้อ ${qz.i+1}/6 · ${N(me)} ถูก ${qScore(me)} · ${N(o)} ถูก ${qScore(o)}</p><h3 class="mt">${esc(q)}</h3>`;
 const btns=(act)=>`<div class="opts">${opt.map((x,i)=>`<button data-a="${act}" data-v="${i}">${esc(x)}</button>`).join('')}</div>`;
 if(st==='ans')h+=`<p>ขั้นที่ 1: เลือกคำตอบของ <b>${N(me)}</b> เอง</p>`+btns('qa');
 else if(st==='waitA')h+=`<div class="wait">รอ ${N(o)} เลือกคำตอบ...</div>`;
 else if(st==='guess')h+=`<p>ขั้นที่ 2: ทายว่า <b>${N(o)}</b> ตอบข้อไหน</p>`+btns('qg');
 else if(st==='waitG')h+=`<div class="wait">รอ ${N(o)} ทายคำตอบของเรา...</div>`;
 else{const i=qz.i,okMe=qz.g[me][i]===qz.a[o][i],okO=qz.g[o][i]===qz.a[me][i];qz.fx=qz.fx||{};if(!qz.fx[i]){qz.fx[i]=1;setTimeout(()=>quizFx(okMe||okO,okMe&&okO),150)}
  h+=`<div class="opts">${opt.map((x,k)=>`<button disabled class="${k===qz.a[o][i]?'ok':''}">${esc(x)}${k===qz.a[me][i]?` · ${N(me)}`:''}${k===qz.a[o][i]?` · ${N(o)}`:''}</button>`).join('')}</div>
  <div class="result"><div class="t">${okMe&&okO?'ใจตรงกันทั้งคู่!':okMe||okO?`${N(okMe?me:o)} ทายถูก`:'ทายผิดทั้งคู่ เล่าให้กันฟังหน่อย'}</div></div><button class="btn mt" style="width:100%" data-a="qnx">${qz.i<5?'ข้อต่อไป':'ดูผล'}</button>`}
 open(h,'quiz')}
function quizFx(ok,both){const ps=[P,Q].map(C=>C.pos.clone().add(new THREE.Vector3(0,CHH+.2,0)));if(ok){ps.forEach(p=>FX.puff(p,[0xff8fb5,0xffd27a],26,1.2,1,.5,1));SFX.win();if(both)fwUser(P.pos.x,16,-30,true)}else SFX.fail()}
function quizView(){if(qz&&qz.mp)return quizViewMP();const a=qz?.a,g=1-a;let h='<h2>ควิซรู้ใจ</h2>';
 if(!qz){h+=`<p class="mute">คนหนึ่งเลือกคำตอบของตัวเองแบบลับๆ แล้วส่งมือถือให้อีกคนทาย 6 ข้อ</p><div class="row mt"><button class="btn" data-a="qstart" data-v="0">${N(0)} เป็นคนตอบ</button><button class="btn pink" data-a="qstart" data-v="1">${N(1)} เป็นคนตอบ</button></div>`}
 else if(qz.step==='end'){const s=qz.score;h+=`<div class="result"><div class="big">${s}/6</div><div class="t">${s>=5?`${N(g)} รู้ใจ ${N(a)} ที่สุดในโลก`:s>=3?'รู้ใจกันดีเลย':'ยังมีเรื่องให้ค้นหากันอีกเยอะ น่ารักออก'}</div></div><div class="row mt"><button class="btn" data-a="qstart" data-v="${g}">สลับให้ ${N(g)} ตอบบ้าง</button>${back}</div>`}
 else{const[q,o]=qz.list[qz.i];h+=`<p class="mute">ข้อ ${qz.i+1}/6 · ถูก ${qz.score}</p><h3 class="mt">${esc(q)}</h3>`;
  if(qz.step==='ans')h+=`<p>${N(a)} เลือกคำตอบของตัวเอง <b>อย่าให้ ${N(g)} เห็น</b></p><div class="opts">${o.map((x,i)=>`<button data-a="qans" data-v="${i}">${esc(x)}</button>`).join('')}</div>`;
  else if(qz.step==='hand')h+=`<div class="result"><div class="t">ส่งมือถือให้ ${N(g)}</div><p>ซ่อนคำตอบไว้เรียบร้อย</p></div><button class="btn pink mt" style="width:100%" data-a="qhand">${N(g)} พร้อมทายแล้ว</button>`;
  else if(qz.step==='guess')h+=`<p>${N(g)} ทายว่า ${N(a)} เลือกข้อไหน</p><div class="opts">${o.map((x,i)=>`<button data-a="qguess" data-v="${i}">${esc(x)}</button>`).join('')}</div>`;
  else{const ok=qz.gs===qz.pick;qz.fx=qz.fx||{};if(!qz.fx[qz.i]){qz.fx[qz.i]=1;setTimeout(()=>quizFx(ok,false),150)}h+=`<div class="opts">${o.map((x,i)=>`<button class="${i===qz.pick?'ok':i===qz.gs?'no':''}" disabled>${esc(x)}</button>`).join('')}</div><div class="result"><div class="t">${ok?'ถูกต้อง! รู้ใจมาก':`เกือบแล้ว คำตอบคือ “${esc(o[qz.pick])}”`}</div></div><button class="btn mt" style="width:100%" data-a="qnext">${qz.i<5?'ข้อต่อไป':'ดูผล'}</button>`}}
 open(h,'quiz')}

let mem=null;
function memNew(mp,noView){mem={mp:!!mp,id:Date.now()%1e9,c:shuffle([...MEM,...MEM].map(([k,col])=>({k,col,o:0,d:0}))),f:-1,lock:0,turn:mp?me:0,sc:[0,0]};if(!noView)memView()}
function memState(){return{id:mem.id,c:mem.c,f:mem.f,lock:mem.lock,turn:mem.turn,sc:mem.sc}}
function memFrom(s){const c=(Array.isArray(s.c)?s.c:[]).slice(0,12).map(x=>{const f=MEM.find(m=>m[0]===(x&&x.k))||MEM[0];return{k:f[0],col:f[1],o:x&&x.o?1:0,d:x&&x.d?1:0}});mem={mp:true,id:s.id|0,c,f:Number.isInteger(s.f)&&s.f>=0&&s.f<12?s.f:-1,lock:s.lock?1:0,turn:s.turn?1:0,sc:[(s.sc&&s.sc[0])|0,(s.sc&&s.sc[1])|0]}}
function memSync(){if(mem&&mem.mp)net({t:'mem',s:memState()})}
function memView(){const end=mem.c.every(c=>c.d);let h=`<div class="score"><div class="${mem.turn?'':'on'}">${N(0)}: ${mem.sc[0]}</div><div class="${mem.turn?'on':''}">${N(1)}: ${mem.sc[1]}</div></div>`;
 if(end){const[a,b]=mem.sc;h+=`<div class="result"><div class="t">${a===b?'เสมอกัน ขอกันได้คนละ 1 อย่าง':`${N(a>b?0:1)} ชนะ! ขอ ${N(a>b?1:0)} ได้ 1 อย่าง`}</div><p class="mute">เช่น กอด นวดไหล่ หรือพาไปกินของอร่อย</p></div><div class="row mt"><button class="btn" data-a="again" data-v="memory">เล่นอีกรอบ</button>${back}</div>`;if(!mem.fxEnd){mem.fxEnd=1;setTimeout(()=>{if(M3)FX.puff(M3.G.position.clone().add(new THREE.Vector3(0,1,0)),CONF,90,2.6,1.6,2.5,1.5);SFX.win()},300)}markDone('memory')}
 else h+=`<p class="mute" style="margin-top:8px">ตาของ <b style="color:var(--gold)">${N(mem.turn)}</b>${mem.mp&&mem.turn===me?' (ตาเรา)':''} · แตะการ์ดบนโต๊ะเพื่อพลิก จับคู่ได้เล่นต่อ</p>`;
 sopen(h,'memory','จับคู่การ์ด')}
function memFlip(i){if(mem.mp&&mem.turn!==me){toast(`ตอนนี้ตาของ ${N(mem.turn)} นะ`,1800);return}const c=mem.c[i];if(mem.lock||c.o||c.d)return;c.o=1;if(mem.f<0){mem.f=i;memView();memSync();return}
 const a=mem.c[mem.f];mem.lock=1;memView();memSync();const same=a.k===c.k;
 setTimeout(()=>{if(same){a.d=c.d=1;mem.sc[mem.turn]++}else{a.o=c.o=0;mem.turn^=1}mem.f=-1;mem.lock=0;memSync();if(view==='memory')memView()},same?500:950)}

const wh={rot:0,from:0,to:0,t:1,spin:false,turn:0,res:null};
function wheelTick(dt){if(!wh.spin)return;wh.t=Math.min(1,wh.t+dt/3.8);const e=1-(1-wh.t)**3;wh.rot=wh.from+(wh.to-wh.from)*e;
 if(wh.t>=1){wh.spin=false;const seg=Math.PI*2/WHEEL.length;wh.res=Math.floor((((-wh.rot)%(Math.PI*2))+Math.PI*2)%(Math.PI*2)/seg);const el=$('#wres');if(el)el.innerHTML=`<div class="result"><div class="t">${esc(WHEEL[wh.res])}</div><p>ทำด้วยกันเลย แล้วสลับให้ ${N(1-wh.turn)} หมุน</p></div>`;wh.turn^=1;markDone('wheel');wheelDoneFx();const tt=$('#sbT');if(tt&&view==='wheel')tt.innerHTML=`วงล้อหวาน · ตาของ ${N(wh.turn)}`;net({t:'res',x:'วงล้อหวานบอกว่า: '+WHEEL[wh.res]})}}

 const pc=gold?[0xf2c14e,0xffe59a]:[0xe8679a,0xffc0d6];const pg=new THREE.SphereGeometry(1,16,10);

 const c=new THREE.Mesh(new THREE.SphereGeometry(.07,12,8),cm(0xffd36b,{emissive:0x6a4a00}));c.position.y=.14;g.add(c);

 else if(a==='walk'){close();const z=ZONES.find(z=>z.id===v);tapTarget=new THREE.Vector3(z.x,0,z.z)}
 else if(a==='fire'){close();startFire()}

  tick:(dt,t)=>{if(!FS)return;FS.bs.forEach((b,i)=>{const sel=i===FS.sel;b.scale.setScalar(.9*(sel?1.08+Math.sin(t*4)*.03:.85));b.rotation.y+=dt*(sel?.9:.15)})}};flowerUI()}
function flowerUI(){sopen(`<p class="mute">แตะช่อดอกไม้บนโต๊ะ หรือเลือกด้านล่าง</p><div class="chips">${BOUQ.map((b,i)=>`<button class="chip${FS.sel===i?' on':''}" data-a="fsel" data-v="${i}">${b.n}</button>`).join('')}</div><div class="row mt"><button class="btn pink" data-a="fbuy" style="flex:1">รับช่อนี้ไป</button>${back}</div>`,'flower','ร้านดอกไม้ · เลือกช่อดอกไม้')}
function flowerAct(a,v){if(!FS)return false;if(a==='fsel'){FS.sel=+v;SFX.pop();flowerUI();return true}
 if(a==='fbuy'){const k=FS.sel;FX.puff(FS.bs[k].getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0,.5,0)),[0xff8fb5,0xffd27a,0xffffff],40,1.4,.9,1,1);SFX.coin();holdBouquet(P,k,true);markDone('flower');endStation();toast(`ได้${BOUQ[k].n}แล้ว เดินไปหา ${N(ot())} แล้วกดมอบให้`,4500,'ร้านดอกไม้');return true}return false}
function holdBouquet(C,k,mine){if(C.bq)C.g.remove(C.bq);const b=makeBouquet(k,.42);b.position.set(.42,.62,.12);b.rotation.z=-.25;C.g.add(b);C.bq=b;C.bqk=k;if(mine)net({t:'bq',k})}
function giftFx(C){const p=C.pos.clone();p.y=groundY(p.x,p.z)+CHH*.7;FX.puff(p,[0xff8fb5,0xffd27a,0xffffff],60,1.8,1.2,.6,1.2);floatHeart(C);SFX.win()}
function giftBouquet(){if(!P.bq)return;const k=P.bqk;const b=P.bq;P.g.remove(b);P.bq=null;const st=P.pos.clone().setY(groundY(P.pos.x,P.pos.z)+1),en=Q.pos.clone().setY(groundY(Q.pos.x,Q.pos.z)+1);b.position.copy(st);scene.add(b);
 tween(.7,e=>{b.position.lerpVectors(st,en,e);b.position.y+=Math.sin(e*Math.PI)*.8;b.rotation.y=e*6},()=>{scene.remove(b);holdBouquet(Q,k,false);giftFx(Q);toast(`มอบ${BOUQ[k].n}ให้ ${N(ot())} แล้ว ♥`,4000)},eio);net({t:'gift',k})}

/* ================= network (PeerJS) ================= */
function online(){return MP&&partnerOn&&conn&&conn.open}
function net(m){if(conn&&conn.open)try{conn.send(m)}catch(e){}}
function fwUser(x,y,z,h){FW.launch(x,y,z,h);SFX.launch();net({t:'fw',x,y,z,h})}
let invFn=null;
function showInv(html,fn){$('#invT').innerHTML=html;invFn=fn;$('#inv').classList.add('on')}
function hideInv(){$('#inv').classList.remove('on');invFn=null}
$('#invYes').onclick=()=>{const f=invFn;hideInv();if(f){if(view)close();if(mode!=='walk')exitToWalk();f()}};$('#invNo').onclick=hideInv;
const GNAME={quiz:'ควิซรู้ใจ',memory:'จับคู่การ์ด',candle:'แข่งจุดเทียน',lotus:'เก็บดอกบัว'};
function invite(g,p){net({t:'inv',g,p});toast(`ส่งคำชวนเล่น${GNAME[g]}ให้ ${N(ot())} แล้ว`,2500)}
function floatHeart(C){for(let i=0;i<5;i++)setTimeout(()=>{tv.copy(C.pos).setY(CHH+.2).project(camera);const d=document.createElement('div');d.className='floatH';d.textContent='♥';d.style.left=((tv.x*.5+.5)*innerWidth+R(-20,20))+'px';d.style.top=((-tv.y*.5+.5)*innerHeight)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1700)},i*140)}
$('#bSnd').onclick=()=>{auInit();setSound(!AU.on)};$('#bSnd').classList.toggle('off',!AU.on);
$('#bHeart').onclick=()=>{floatHeart(P);net({t:'hv'})};
function onNet(m){if(!m||typeof m!=='object')return;const o=ot();
 switch(m.t){
 case'hello':names[o]=String(m.name||'').slice(0,14);if(CH[m.ch]&&(m.ch==='boy'||m.ch==='girl'))setLook(Q,CH[m.ch]);if(m.d)mk.d[o]=sanD(m.d);Q.seen=true;if(!partnerOn){}partnerOn=true;setNames();setRoom();
  if(!Q.placed){Q.placed=1;Q.pos.copy(P.pos).add(new THREE.Vector3(.9,0,.3));qT.copy(Q.pos)}toast(`${N(o)} เข้างานแล้ว เดินไปหากันได้เลย`,4000,'แฟนมาแล้ว');floatHeart(Q);break;
 case'st':qT.set(+m.x||0,0,+m.z||0);Q.flip=m.f?1:0;Q.moving=!!m.m;break;
 case'hv':floatHeart(Q);break;
 case'show':if(!SHOW.on)startShow(true);break;
 case'bq':if(m.k==null){if(Q.bq){Q.g.remove(Q.bq);Q.bq=null}}else holdBouquet(Q,Math.min(2,Math.max(0,m.k|0)),false);break;
 case'gift':if(Q.bq){Q.g.remove(Q.bq);Q.bq=null}holdBouquet(P,Math.min(2,Math.max(0,m.k|0)),false);giftFx(P);toast(`${N(o)} มอบ${BOUQ[m.k|0].n}ให้ ♥`,4500,'ได้รับดอกไม้');break;
 case'fw':FW.launch(+m.x||0,Math.max(6,Math.min(32,+m.y||18)),+m.z||-32,!!m.h);break;
 case'krd':mk.d[o]=sanD(m.d);if(cr)placePartnerK();break;
 case'kr':mk.d[o]=sanD(m.d);mk.w[o]=String(m.w||'').slice(0,140);mk.ready[o]=true;
  if(mk.ready[me])checkFloat();else{if(cr){placePartnerK();crStage()}else showInv(`<b>${N(o)}</b> ทำกระทงเสร็จแล้ว รอลอยด้วยกันที่ท่าน้ำ`,()=>enterZone('make'))}break;
 case'kru':mk.ready[o]=false;break;
 case'lan':{const g=makeLantern3D(String(m.txt||'').slice(0,36)||'♥');g.position.copy(LANPOS).add(new THREE.Vector3(R(-1,1),0,R(-1.5,-.5)));scene.add(g);launchLantern(g,'',false);toast(`ปล่อยโคม: ${esc(String(m.txt||'').slice(0,36))}`,4500,N(o));break}
 case'inv':{const g=m.g;if(!GNAME[g])break;const p=m.p||{};
  if(g==='quiz'&&Array.isArray(p.list))qzNewMP({id:p.id,list:p.list.filter(i=>QUIZ[i]).slice(0,6)});
  if(g==='memory'&&Array.isArray(p.c))memFrom(p);
  showInv(`<b>${N(o)}</b> ชวนเล่น${GNAME[g]}`,()=>enterZone(g,p));break}
 case'qz':if(qz&&qz.mp&&qz.id===m.id){const i=m.i|0,v=m.v|0;if(m.k==='a')qz.a[o][i]=v;if(m.k==='g')qz.g[o][i]=v;if(m.k==='n'&&qz.i===i)qz.i++;if(view==='quiz')quizView()}break;
 case'mem':if(m.s&&Array.isArray(m.s.c)){memFrom(m.s);if(view==='memory')memView()}break;
 case'cgt':if(!cg||!cg.mp)cg={mp:true,turn:me,m:0,time:[null,null],t:0,ph:'ready',wind:'calm',wt:2};cg.time[o]=+m.v||0;if(cg.time[me]!=null){cg.ph='done';markDone('candle')}if(view==='candle')candleView();break;
 case'ls':if(lg){lg.ps=m.s|0;if(m.f)lg.pf=1}break;
 case'res':toast(esc(String(m.x||'').slice(0,200)),5000,N(o));break;
 }}
function sanD(d){d=d||{};const cl=(v,a,b)=>Math.min(b,Math.max(a,v|0));const o={base:cl(d.base,0,2),flower:cl(d.flower,0,3),candle:cl(d.candle,0,2)};if(Array.isArray(d.lv))o.lv=[...new Set(d.lv.map(x=>cl(x,0,19)))].slice(0,20);if(Array.isArray(d.fl))o.fl=d.fl.slice(0,24).map(f=>[cl(f&&f[0],0,3)].concat([1,2,3].map(j=>Math.max(-.3,Math.min(.5,+(f&&f[j])||0)))));return o}
function bindConn(c){conn=c;
 c.on('open',()=>{partnerOn=true;setRoom();net({t:'hello',name:names[me],ch:myChar,d:mk.d[me]})});
 c.on('data',onNet);
 c.on('close',()=>{if(conn!==c)return;partnerOn=false;setRoom();toast(`${N(ot())} หลุดจากห้อง ${isHost?'รอให้เข้าใหม่ได้':'กำลังลองต่อใหม่...'}`,4000);if(!isHost)setTimeout(retryJoin,1500)});
 c.on('error',()=>{})}
function setRoom(){const r=$('#room');if(!MP){r.classList.remove('on');return}r.classList.add('on');r.classList.toggle('ok',!!partnerOn);r.innerHTML=`<i></i>ห้อง ${esc(roomCode)} · ${partnerOn?`${N(ot())} ออนไลน์`:'รอแฟน...'}`}
const PFX='loykrathong26-';
function netFail(msg){clearTimeout(netTO);try{peer&&peer.destroy()}catch(_){}peer=null;MP=false;['#bJoin','#bHost'].forEach(b=>$(b).disabled=false);$('#load').innerHTML=msg+(IN_FRAME?'<br><small>หน้านี้เปิดผ่าน Claude ซึ่งบล็อกการเชื่อมต่อ 2 เครื่อง ใช้ลิงก์เว็บจริง หรือกด “เล่นเครื่องเดียวกัน”</small>':'<br><small>ลองเปลี่ยน Wi‑Fi / ปิด VPN แล้วกดอีกครั้ง หรือกด “เล่นเครื่องเดียวกัน”</small>')}
let netTO=0;const IN_FRAME=(()=>{try{return window.top!==window.self}catch(_){return true}})();
function hostRoom(){if(!window.Peer){netFail('โหลดระบบเชื่อมต่อไม่ได้');return}
 isHost=true;me=0;MP=true;roomCode=String(Math.floor(1000+Math.random()*9000));$('#load').textContent='กำลังสร้างห้อง...';
 try{peer=new Peer(PFX+roomCode)}catch(e){netFail('สร้างห้องไม่ได้');return}netTO=setTimeout(()=>netFail('สร้างห้องไม่สำเร็จ (เชื่อมต่อเซิร์ฟเวอร์ไม่ได้)'),12000);
 peer.on('open',()=>{clearTimeout(netTO);$('#iStart').hidden=true;$('#iHost').hidden=false;$('#load').textContent='';$('#codeBig').textContent=roomCode;const u=location.href.split('?')[0].split('#')[0]+'?room='+roomCode;$('#linkTxt').textContent=u;$('#bCopy').onclick=()=>{navigator.clipboard?.writeText(u).then(()=>$('#bCopy').textContent='คัดลอกแล้ว',()=>{})}});
 peer.on('connection',c=>{if(conn&&conn.open){c.on('open',()=>c.close());return}bindConn(c)});
 peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();hostRoom();return}if(started)toast('การเชื่อมต่อมีปัญหา ('+e.type+')',3000);else netFail('เชื่อมต่อไม่ได้ ('+e.type+')')});
 peer.on('disconnected',()=>{try{peer.reconnect()}catch(_){}})}
function joinRoom(code){if(!window.Peer){netFail('โหลดระบบเชื่อมต่อไม่ได้');return}
 isHost=false;me=1;MP=true;roomCode=code;$('#load').textContent='กำลังเข้าห้อง '+code+'...';
 try{peer=new Peer()}catch(e){netFail('เข้าห้องไม่ได้');return}netTO=setTimeout(()=>{if(!started)netFail('เข้าห้องไม่สำเร็จ (หมดเวลา) ให้แฟนเปิดหน้าห้องค้างไว้แล้วลองใหม่')},15000);peer.on('open',()=>connectTo());
 peer.on('error',e=>{if(e.type==='peer-unavailable'){if(started){toast('ยังติดต่อแฟนไม่ได้ กำลังลองใหม่...',2500);setTimeout(retryJoin,3000)}else{$('#load').textContent='ไม่พบห้อง '+code+' เช็กรหัสอีกครั้ง หรือให้แฟนเปิดหน้าห้องไว้';['#bJoin','#bHost'].forEach(b=>$(b).disabled=false)}}else if(started)toast('การเชื่อมต่อมีปัญหา ('+e.type+')',3000);else netFail('เชื่อมต่อไม่ได้ ('+e.type+')')});
 peer.on('disconnected',()=>{try{peer.reconnect()}catch(_){}})}
function connectTo(){const c=peer.connect(PFX+roomCode,{reliable:true});bindConn(c);c.on('open',()=>{clearTimeout(netTO);if(!started)enterWorld()})}
function retryJoin(){if(online()||isHost||!peer)return;connectTo()}

/* ================= intro ================= */
let started=false;
document.querySelectorAll('.pc').forEach(b=>{const cv=b.querySelector('canvas');cv.getContext('2d').drawImage(charCanvas(CH[b.dataset.ch],0),0,0);b.onclick=()=>{myChar=b.dataset.ch;document.querySelectorAll('.pc').forEach(x=>x.classList.toggle('on',x===b))}});
document.querySelector(`.pc[data-ch="${myChar}"]`)?.classList.add('on');
$('#n1').value=store.get('myname',names[0]||'');$('#n2').value=names[1]||'';
const urlRoom=(location.search.match(/room=(\d{4})/)||[])[1];if(urlRoom){$('#code').value=urlRoom}
function needName(){const v=$('#n1').value.trim();if(!v){$('#n1').focus();$('#load').textContent='ใส่ชื่อของคุณก่อนนะ';return null}return v}
function prepMe(){P.pos.set(me?.6:-1.2,0,me?48.3:48);setLook(P,CH[myChar]);store.set('char',myChar)}
$('#bHost').onclick=()=>{const n=needName();if(!n)return;store.set('myname',n);names=[n,''];me=0;prepMe();$('#bHost').disabled=$('#bJoin').disabled=true;hostRoom()};
$('#bJoin').onclick=()=>{const n=needName();if(!n)return;const c=$('#code').value.trim();if(!/^\d{4}$/.test(c)){$('#load').textContent='รหัสห้องเป็นตัวเลข 4 ตัว';return}store.set('myname',n);names=['',n];me=1;prepMe();$('#bHost').disabled=$('#bJoin').disabled=true;joinRoom(c)};
$('#bSolo').onclick=()=>{$('#soloBox').hidden=false;$('#n2').focus()};
$('#bEnter').onclick=()=>enterWorld();
function enterWorld(){if(started)return;started=true;$('#intro').remove();setNames();setRoom();
 if(MP){Q.g.visible=partnerOn;if(!partnerOn)toast(`ส่งรหัสห้อง ${esc(roomCode)} ให้แฟน แล้วเดินเล่นรอได้เลย`,6000,'รอแฟนเข้าห้อง');else toast('เดินไปที่วงแหวนเรืองแสงหน้าซุ้มเพื่อเล่นเกม แล้วไปท่าน้ำลอยกระทงด้วยกัน',5500,'เข้างานแล้ว')}
 else toast(`เดินไปที่วงแหวนเรืองแสงหน้าซุ้มเพื่อเล่นเกม แล้วไปท่าน้ำเพื่อลอยกระทงด้วยกัน`,5500,`สุขสันต์วันลอยกระทง ${N(0)} กับ ${N(1)}`);
 camTarget.set(P.pos.x,.8,P.pos.z);FW.launch(0,20,-30,true)}
$('#introForm').addEventListener('submit',e=>{e.preventDefault();if($('#soloBox').hidden||started)return;const n=needName();if(!n)return;MP=false;me=0;names=[n,$('#n2').value.trim()];store.set('names',names);store.set('myname',n);prepMe();setLook(Q,CH[myChar==='boy'?'girl':'boy']);enterWorld()});
</script>
